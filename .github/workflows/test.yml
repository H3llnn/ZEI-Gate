name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ZEI-Gate
      - uses: actions/checkout@v4
        with:
          repository: H3llnn/ZEI-Userbot
          path: ZEI-Userbot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ZEI-Gate/requirements.txt ./ZEI-Userbot
      - run: python -m unittest discover -s tests -v
        working-directory: ZEI-Gate
      - run: python -m compileall -q subgate tests main.py install.py
        working-directory: ZEI-Gate
